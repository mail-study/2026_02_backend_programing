<html>
<head>
<meta charset="UTF-8">
</head>
<body>
	<h3>빠른 중식 배달 주문서</h3>
	<hr>
	<form name="orderForm" method="post" action="order_process.jsp">
	<p>
		주문자명: <input type="text" name="customerName" size="10"><br>
		비밀번호(4자): <input type="password" name="customerPass" size="6" maxlength="4">
	</p>
	<p>
		<strong>대표 식사 메뉴 선택 (택1)</strong><br>
		<label>
			<input type="radio" name="mainDish" value="jajang" checked>
			짜장면 <img src="../../web1_media/03/jajajang.png" width="50">
		</label>
		
		<label>
			<input type="radio" name="mainDish" value="jajang" checked>
			짬뽕 <img src="../../web1_media/03/jjambbong.png" width="50">
		</label>
		
		<label>
			<input type="radio" name="mainDish" value="jajang" checked>
			탕수육 <img src="../../web1_media/03/jajang.png" width="50">
		</label>
	</p>
	<p>
		<strong>추가 옵션:</strong>
		<label><input type="checkbox" name="side" value="danmuji" checked>단무지</label>
		<label><input type="checkbox" name="side" value="onion" checked>양파</label>
	</p>
	<p>
		결제 방식:
		<select name="payment">
			<option value="card" selected>신용카드</option>
			<option value="cash">현금 결제 </option>
			<option value="pay">간편 결 </option>
		</select>
	</p>
	<p>
		<button type="submit">주문 완료</button>
		<input>
	</p>
	</form>
</body>
</html>
