<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>랜덤색 만들기</title>
        <style>
            div {
                display: inline-block;
                width: 150px;
                padding: 10px;
            }
        </style>
    </head>
    <body>
        <h3>랜덤색 만들기</h3>
        <hr />
        <script>
            function newColor() {
                let r = Math.floor(Math.random() * 256);
                let g = Math.floor(Math.random() * 256);
                let b = Math.floor(Math.random() * 256);
                return 'rgb(' + r + ', ' + g + ', ' + b + ')'; // rgb(r,g,b)
            }

            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    let str = "<div style= 'background-color: ";
                    let color = newColor();
                    str += color;
                    str += "'>" + color + '</div>';
                    document.write(str);
                }
                document.write('<br>');
            }
        </script>
    </body>
</html>
