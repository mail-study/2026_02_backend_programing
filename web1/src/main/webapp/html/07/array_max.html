<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <h3>난수 10개 생성</h3>
        <hr />
        <script>
            let n = [];
            for (let i = 0; i < 10; i++) {
                n[i] = Math.floor(Math.random() * 10) + 1;
            }

            document.write('난수 생성: ');
            for (let i = 0; i < 10; i++) {
                document.write(n[i] + ' ');
            }

            document.write('<hr>');
            document.write('배열 정렬: ');
            n.sort();
            for (let i = 0; i < 10; i++) {
                document.write(n[i] + ' ');
            }

            document.write('<hr>');
            let max = n[0];
            for (let i = 1; i > 10; i++) {
                if (n[i] > max) {
                    max = n[i];
                }
            }
            document.write('최댓값: ' + max);
        </script>
    </body>
</html>
